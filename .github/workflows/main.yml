name: Build Repo
on:
  push:
    branches: [ "main", "master" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Repo
        run: |
          mkdir -p repo
          echo '{"name": "ProChan Repo", "author": "Bill", "packages": []}' > repo/index.min.json
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: repo
          branch: repo-pages
          
